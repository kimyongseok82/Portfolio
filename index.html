    background: radial-gradient( 420px circle at var(--mx, 50%) var(--my, 0%), rgba(168, 85, 247, 0.16), transparent 45% );
    opacity: 0;
    transition: opacity 0.35s;
  }
  .glow-card::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    padding: 1px;
    pointer-events: none;
    background: radial-gradient( 260px circle at var(--mx, 50%) var(--my, 0%), rgba(0, 229, 255, 0.9), rgba(168, 85, 247, 0.6) 40%, transparent 70% );
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.35s;
  }
  .glow-card:hover, .glow-card:focus-within {
    transform: translateY(-6px) scale(1.015);
    border-color: rgba(168, 85, 247, 0.55);
    box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.15), 0 24px 60px -20px rgba(168, 85, 247, 0.45), 0 0 40px -10px rgba(0, 229, 255, 0.25);
  }
  .glow-card:hover::before, .glow-card:hover::after, .glow-card:focus-within::before, .glow-card:focus-within::after {
    opacity: 1;
  }
  .btn {
    position: relative;
    isolation: isolate;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    min-height: 48px;
    padding: 0 1.5rem;
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s var(--ease-out-expo), box-shadow 0.3s, border-color 0.3s, color 0.3s, background 0.3s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(110deg, transparent 25%, rgba(255, 255, 255, 0.55) 50%, transparent 75%);
    transform: translateX(-120%);
    transition: transform 0.75s var(--ease-out-expo);
  }
  .btn:hover::after, .btn:focus-visible::after {
    transform: translateX(120%);
  }
  .btn:hover {
    transform: translateY(-2px);
  }
  .btn:active {
    transform: translateY(0) scale(0.98);
  }
  .btn-primary {
    color: #fff;
    background: linear-gradient(100deg, #7c3aed, var(--color-neon) 45%, #22d3ee);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12) inset, 0 10px 30px -10px rgba(168, 85, 247, 0.7);
  }
  .btn-primary:hover {
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2) inset, 0 14px 40px -8px rgba(168, 85, 247, 0.9), 0 0 30px -4px rgba(0, 229, 255, 0.55);
  }
  .btn-ghost {
    color: #e4e4e7;
    background: rgba(17, 17, 27, 0.6);
    border: 1px solid var(--color-line);
    backdrop-filter: blur(8px);
  }
  .btn-ghost::after {
    background: linear-gradient(110deg, transparent 25%, rgba(0, 229, 255, 0.28) 50%, transparent 75%);
  }
  .btn-ghost:hover {
    color: #fff;
    border-color: rgba(0, 229, 255, 0.6);
    box-shadow: 0 0 24px -6px rgba(0, 229, 255, 0.55);
  }
  .text-gradient {
    background: linear-gradient(100deg, #ffffff 10%, #e9d5ff 35%, var(--color-neon) 60%, var(--color-aqua) 95%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .text-glow {
    filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.45)) drop-shadow(0 0 2px rgba(0, 229, 255, 0.4));
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.4rem 0.85rem;
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    color: #e4e4e7;
    border: 1px solid var(--color-line);
    background: rgba(168, 85, 247, 0.07);
    white-space: nowrap;
  }
  .grid-floor {
    position: absolute;
    left: -50%;
    right: -50%;
    bottom: -8%;
    height: 55%;
    transform: perspective(520px) rotateX(64deg);
    transform-origin: 50% 100%;
    background-image: linear-gradient(rgba(168, 85, 247, 0.45) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.35) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: linear-gradient(to top, #000 10%, transparent 85%);
    animation: floor-move 6s linear infinite;
    opacity: 0.55;
  }
  @keyframes floor-move {
    to {
      background-position: 0 56px, 0 0;
    }
  }
  .orb-scene {
    perspective: 900px;
    transform-style: preserve-3d;
  }
  .orb-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(168, 85, 247, 0.35);
    box-shadow: 0 0 30px -6px rgba(168, 85, 247, 0.35), inset 0 0 30px -10px rgba(0, 229, 255, 0.3);
    animation: ring-spin 18s linear infinite;
  }
  .orb-ring:nth-child(2) {
    inset: 9%;
    border-color: rgba(0, 229, 255, 0.35);
    animation-duration: 24s;
    animation-direction: reverse;
    --tilt: 62deg;
  }
  .orb-ring:nth-child(3) {
    inset: 18%;
    border-style: dashed;
    border-color: rgba(168, 85, 247, 0.3);
    animation-duration: 30s;
    --tilt: 75deg;
  }
  @keyframes ring-spin {
    from {
      transform: rotateX(var(--tilt, 70deg)) rotateZ(0deg);
    }
    to {
      transform: rotateX(var(--tilt, 70deg)) rotateZ(360deg);
    }
  }
  .caret {
    display: inline-block;
    width: 0.6ch;
    height: 1.05em;
    margin-left: 0.15em;
    vertical-align: -0.15em;
    background: var(--color-aqua);
    box-shadow: 0 0 10px var(--color-aqua);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink {
    50% {
      opacity: 0;
    }
  }
  .scroll-dot {
    animation: scroll-dot 1.8s var(--ease-out-expo) infinite;
  }
  @keyframes scroll-dot {
    0% {
      transform: translateY(0);
      opacity: 0;
    }
    30% {
      opacity: 1;
    }
    100% {
      transform: translateY(14px);
      opacity: 0;
    }
  }
  .hud-corner {
    position: absolute;
    width: 22px;
    height: 22px;
    border-color: rgba(0, 229, 255, 0.5);
  }
  .pulse {
    animation: pulse 3.2s var(--ease-out-expo) infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  @keyframes pulse {
    0% {
      transform: scale(0.6);
      opacity: 0.9;
    }
    100% {
      transform: scale(1.6);
      opacity: 0;
    }
  }
  .spin-slow {
    animation: spin 26s linear infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  .spin-slow-rev {
    animation: spin 34s linear infinite reverse;
    transform-origin: center;
    transform-box: fill-box;
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
  .placeholder-box {
    border: 1px dashed rgba(161, 161, 170, 0.35);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.02);
  }
  .field-input {
    width: 100%;
    font-size: 16px;
    color: #fff;
    background: rgba(8, 8, 13, 0.7);
    border: 1px solid var(--color-line);
    border-radius: 12px;
    padding: 0.7rem 0.9rem;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field-input:focus {
    outline: none;
    border-color: var(--color-aqua);
    box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.15);
  }
  .field-input::placeholder {
    color: #71717a;
  }
}
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}
@media (max-width: 768px), (hover: none) {
  .glass {
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .grid-floor {
    animation: none;
  }
  .glow-card:hover {
    transform: none;
  }
  .glow-card:active {
    transform: scale(0.99);
  }
}
.letter {
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
section:focus {
  outline: none;
