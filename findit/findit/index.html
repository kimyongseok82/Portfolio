      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b style="color:var(--navy)">${icon('user')} 내 게시글 관리</b>
        <select class="select" id="status-sel" style="width:auto;padding:8px 34px 8px 12px;font-size:14px" aria-label="게시글 상태 변경">${Object.entries(STATUS).filter(([k])=>isLost?k!=='found':k!=='searching').map(([k,s])=>`<option value="${k}" ${it.status===k?'selected':''}>${s.label}</option>`).join('')}</select></div>
      <div class="action-row"><a class="btn btn-outline" href="#/edit/${esc(id)}">${icon('edit')}수정</a><button class="btn btn-danger" id="del-btn">${icon('trash')}삭제</button>${it.status!=='returned'?`<button class="btn btn-teal" id="ret-btn">${icon('handshake')}반환 완료 처리</button>`:''}</div>
      <button class="btn btn-ghost btn-sm" id="show-secret" style="align-self:flex-start">${icon('eye')}내 비공개 인증 정보 보기</button><div id="secret-area"></div>
      <div class="secret-reveal" style="background:var(--bg);border-style:solid;border-color:var(--line-2)">연락 방법: <b>${esc(contact?.label||'')}</b> ${contact?.value?`· ${esc(contact.value)}`:''}</div>
    </div>
    <div class="action-card"><b style="color:var(--navy)">${icon('shield')} 받은 인증 요청 <span class="hint">(${received.length}건${fails?` · 실패한 시도 ${fails}회`:''})</span></b>
      ${received.length ? `<div class="claims-list">${received.map(claimReceivedHtml).join('')}</div>` : `<p class="hint">아직 받은 인증 요청이 없어요.</p>`}
    </div>`;
  } else {
    let claimArea = '';
    if(it.status==='returned') claimArea = `<div class="notice notice-ok">${icon('check')}<div><b>반환이 완료된 물건입니다.</b> 더 이상 인증 요청을 받지 않아요.</div></div>`;
    else claimArea = `<button class="btn btn-primary btn-lg btn-block" id="claim-btn">${icon('shield')}${claimBtnLabel}</button>`;
    let myClaim = '';
    if(u){
      const sent = Api.myClaimsSent().filter(c=>c.itemId===id);
      const last = sent[0];
      if(last){
        const contact = last.status==='approved' ? Api.getContact(id) : null;
        myClaim = `<div class="claim-item"><div class="claim-head"><span class="who">내 인증 요청</span>${claimBadge(last.status)}</div>
          <div class="claim-body"><span>${CLAIM_STATUS[last.status].desc} · ${relTime(last.createdAt)}</span>${last.note?`<span class="hint">${esc(last.note)}</span>`:''}
          ${contact ? `<div class="contact-box">${icon('check')} 등록자 연락처 (${esc(contact.label)})<b>${esc(contact.value)}</b></div><div class="notice notice-warn">${icon('alert')}<div>물건은 <b>지구대·역 유실물센터·사람이 많은 카페</b> 등 안전한 공공장소에서 주고받으세요. 선입금·보상금 요구는 거절하세요.</div></div>`:''}</div></div>`;
      }
    }
    actionHtml = `<div class="action-card">${claimArea}${myClaim}
      <div class="action-row"><a class="btn btn-outline" href="#/search">${icon('left')}목록으로 돌아가기</a><button class="btn btn-ghost" id="report-btn">${icon('flag')}게시글 신고</button></div>
      <p class="hint" style="text-align:center">${isLost?'물건을 가지고 계신가요? 등록자가 숨겨 둔 특징을 확인해 진짜 습득자인지 증명해요.':'등록자가 숨겨 둔 특징 질문에 답하면 등록자에게 요청이 전달돼요.'}</p>
    </div>`;
  }
  return { html: `<div class="container page">
    <a class="back-link" href="#/search">${icon('left')}목록으로</a>
    <div class="detail">
      <div>
        <div class="gallery-main"><img id="g-main" src="${esc(imgs[0])}" alt="${esc(it.title)} 사진">${it.status==='returned'?`<div class="done-overlay"><span>${icon('check')}반환 완료</span></div>`:''}</div>
        ${imgs.length>1?`<div class="thumbs">${imgs.map((s,i)=>`<button class="thumb ${i===0?'on':''}" data-src="${esc(s)}" aria-label="사진 ${i+1}"><img src="${esc(s)}" alt=""></button>`).join('')}</div>`:''}
        ${it.isSample?`<p class="hint" style="margin-top:10px">${icon('info')} 시연을 위한 샘플 게시글이며, 사진은 일러스트입니다.</p>`:''}
        <div class="action-card" style="margin-top:18px">
          <b style="color:var(--navy)">${icon('user')} 작성자 확인</b>
          <div class="author-box"><span class="avatar">${esc((author?.name||'?')[0])}</span><div><b>${esc(author?.name||'탈퇴한 사용자')} ${author?.isSample?'<span class="cs cs-pending" style="font-size:11px">체험 계정</span>':''}</b>
          <span>${author?`가입 ${fmtDate(author.joinedAt)} · 게시글 ${author.posts}개 · 반환 완료 ${author.returned}건`:''}</span></div></div>
          <div class="notice notice-info" style="font-size:13.5px">${icon('shield')}<div>FIND IT은 <b>선입금·보상금·택배비</b>를 먼저 요구하지 않습니다. 이런 요구를 받으면 신고해 주세요.</div></div>
        </div>
      </div>
      <div class="detail-info">
        <div class="top-row"><span class="type-pill ${it.type}">${isLost?'분실물':'습득물'}</span>${statusBadge(it.status)}${it.verified?`<span class="cs cs-approved">${icon('shield')}소유자 확인 완료</span>`:''}${it.isSample?'<span class="cs cs-pending">샘플</span>':''}</div>
        <h1>${esc(it.title)}</h1>
        <dl class="info-table">
          <div class="info-row"><dt>${icon('package')}카테고리</dt><dd>${catName(it.category)}</dd></div>
          <div class="info-row"><dt>${icon('pin')}${W} 장소</dt><dd>${esc(it.place)}</dd></div>
          <div class="info-row"><dt>${icon('calendar')}${W} 날짜</dt><dd>${fmtDate(it.date)}</dd></div>
          <div class="info-row"><dt>${icon('clock')}작성일</dt><dd>${fmtDateTime(it.createdAt)}${it.updatedAt!==it.createdAt?` <span class="hint">(수정됨)</span>`:''}</dd></div>
          <div class="info-row"><dt>${icon('shield')}소유자 인증</dt><dd>${it.hasQuestion?'비공개 확인 질문 설정됨':'등록자 직접 확인 방식'}</dd></div>
        </dl>
        <div class="desc-box"><h3>물건 특징</h3><p>${esc(it.description)}</p></div>
        ${it.highValue?`<div class="notice notice-warn" style="margin-top:16px">${icon('receipt')}<div><b>고가 물품</b> · 소유자 확인 시 영수증, 구매 내역, 시리얼 번호 등 추가 증빙을 준비해 주세요.</div></div>`:''}
        ${actionHtml}
      </div>
    </div></div>`,
  mount(){
    document.querySelectorAll('.thumb').forEach(t=>t.addEventListener('click', ()=>{ document.getElementById('g-main').src = t.dataset.src; document.querySelectorAll('.thumb').forEach(x=>x.classList.toggle('on', x===t)); }));
    const $ = id => document.getElementById(id);
    if(it.isMine){
      $('status-sel').addEventListener('change', e=>{ try { Api.setStatus(id, e.target.value); toast('게시글 상태가 변경되었습니다.'); render(); } catch(err){ toast(err.message,'err'); } });
      $('del-btn').addEventListener('click', ()=>confirmModal({title:'게시글 삭제', text:'이 게시글과 관련된 인증 요청이 모두 삭제됩니다. 삭제 후에는 되돌릴 수 없어요.', okText:'삭제', danger:true, onOk:()=>{ Api.deleteItem(id); toast('게시글이 삭제되었습니다.'); go('#/mypage/'+(isLost?'lost':'found')); }}));
      $('ret-btn')?.addEventListener('click', ()=>confirmModal({title:'반환 완료 처리', text:'물건을 실제로 주인에게 돌려주셨나요(또는 돌려받으셨나요)? 반환 완료로 표시하면 더 이상 인증 요청을 받지 않아요.', okText:'반환 완료', onOk:()=>{ Api.setStatus(id,'returned'); toast('반환 완료! 함께 찾아 주셔서 감사합니다.'); render(); }}));
      $('show-secret').addEventListener('click', e=>{ const s = Api.getMySecret(id); $('secret-area').innerHTML = `<div class="secret-reveal">${s.question?`<div>질문: <b>${esc(s.question)}</b></div><div>정답: <b>${esc(s.answer)}</b></div>`:'설정된 확인 질문이 없습니다. 요청자의 설명을 보고 직접 판단해요.'}<div class="hint" style="margin-top:4px">이 정보는 작성자 본인에게만 보입니다.</div></div>`; e.currentTarget.remove(); });
      bindClaimDecisions(document.getElementById('main'));
    } else {
      $('claim-btn')?.addEventListener('click', ()=>{ if(!Api.currentUser()){ toast('소유자 확인 요청은 로그인 후 이용할 수 있어요.','err'); go('#/login?next='+encodeURIComponent('/item/'+id)); return; } claimModal(it); });
      $('report-btn').addEventListener('click', ()=>{ if(!Api.currentUser()){ toast('신고는 로그인 후 이용할 수 있어요.','err'); go('#/login?next='+encodeURIComponent('/item/'+id)); return; } reportModal(it); });
    }
  }};
}
function claimReceivedHtml(c){
  return `<div class="claim-item">
    <div class="claim-head"><span class="who"><span class="avatar" style="width:26px;height:26px;font-size:12px">${esc(c.claimantName[0])}</span>${esc(c.claimantName)}${c.item?` <a class="hint" href="#/item/${esc(c.item.id)}" style="font-weight:500">· ${esc(c.item.title)}</a>`:''}</span>${claimBadge(c.status)}</div>
    <div class="claim-body">
      ${c.question?`<div class="qa">질문: <b>${esc(c.question)}</b><br>답변: <b>${esc(c.answer)}</b> ${c.status==='submitted'?'<span class="cs cs-approved" style="font-size:11px">자동 확인 일치</span>':''}</div>`:`<div class="qa">요청자가 설명한 숨은 특징: <b>${esc(c.answer)}</b></div>`}
      ${c.message?`<div>메시지: ${esc(c.message)}</div>`:''}
      <span class="hint">${fmtDateTime(c.createdAt)} 요청${c.decidedAt?` · ${fmtDateTime(c.decidedAt)} 처리`:''}${c.note?` · ${esc(c.note)}`:''}</span>
      ${c.claimantEmail?`<div class="contact-box">${icon('check')} 요청자 연락처 (계정 이메일)<b>${esc(c.claimantEmail)}</b></div>`:''}
    </div>
    ${['pending','submitted'].includes(c.status)?`<div class="notice notice-warn" style="margin-top:10px;font-size:13.5px">${icon('alert')}<div>답변이 일치해도 <b>자동으로 확정되지 않아요.</b> 실제 물건과 비교해 확실할 때만 승인하세요. ${c.item?.highValue?'고가 물품이므로 영수증 등 추가 증빙을 요청하세요.':''}</div></div>
    <div class="claim-actions"><button class="btn btn-teal btn-sm" data-decide="${esc(c.id)}" data-ok="1">${icon('check')}승인</button><button class="btn btn-danger btn-sm" data-decide="${esc(c.id)}" data-ok="0">${icon('x')}거절</button></div>`:''}
  </div>`;
}
function bindClaimDecisions(root){
  const h = e => {
    const b = e.target.closest('[data-decide]'); if(!b) return;
    const ok = b.dataset.ok==='1';
    confirmModal({ title: ok?'인증 요청 승인':'인증 요청 거절',
      text: ok ? '승인하면 서로의 연락처가 공개되고 <b>소유자 확인 완료</b> 상태가 됩니다. 같은 게시글의 다른 대기 요청은 자동으로 종료돼요.<br><br>물건은 반드시 <b>안전한 공공장소</b>에서 전달하세요.' : '이 요청을 거절할까요? 요청자에게 "인증 거절"로 표시됩니다.',
      okText: ok?'승인':'거절', danger:!ok,
      onOk: ()=>{ Api.decideClaim(b.dataset.decide, ok); toast(ok?'승인했습니다. 연락처가 서로에게 공개되었어요.':'요청을 거절했습니다.'); setTimeout(render,0); } });
  };
  root.addEventListener('click', h);
}

/* ---------- 소유자 인증 모달 ---------- */
function claimModal(it){
  let info; try { info = Api.getClaimInfo(it.id); } catch(e){ toast(e.message,'err'); return; }
  const isLost = it.type==='lost';
  const head = (step) => `<div class="modal-head"><h2>${icon('shield')}${isLost?'습득자 확인 요청':'소유자 확인 요청'}</h2><button class="modal-close" data-close aria-label="닫기">${icon('x')}</button></div>`;
  const ind = n => `<div class="steps-ind">${[1,2,3].map(i=>`<span class="${i<=n?'on':''}"></span>`).join('')}</div>`;
  if(info.closed){ toast('이미 반환이 완료된 게시글입니다.','err'); return; }
  if(info.activeClaim){ openModal(head()+`<div class="modal-body"><div class="result-ic wait">${icon('clock')}</div><div class="result-title">${CLAIM_STATUS[info.activeClaim.status].label}</div><p class="result-text">이미 이 게시글에 보낸 요청이 진행 중이에요. 마이페이지에서 진행 상황을 확인하세요.</p><div class="modal-foot"><a class="btn btn-outline" href="#/mypage/sent" data-close>내가 보낸 요청</a><button class="btn btn-primary" data-close>확인</button></div></div>`); return; }
  if(info.lockedUntil) return lockedView(info.lockedUntil);

  // 1단계: 안내
  openModal(head()+`<div class="modal-body">${ind(1)}
    <p style="color:var(--text-2)">${isLost
      ? '이 물건을 가지고 계신가요? 등록자(주인)가 숨겨 둔 특징을 물건에서 직접 확인해 답해 주세요. 진짜 습득자임을 확인하는 절차예요.'
      : '이 물건이 내 것인지 확인하기 위해, 등록자가 숨겨 둔 특징에 대한 질문에 답하게 됩니다.'}</p>
    <div class="notice notice-info">${icon('info')}<div><ul style="margin:0 0 0 16px">
      <li>답변이 일치하면 요청이 등록자에게 전달되고, <b>등록자가 최종 승인</b>해야 연락처가 공개돼요.</li>
      <li>답변이 ${MAX_FAILS}번 연속 틀리면 <b>${LOCK_MINUTES}분 동안</b> 다시 시도할 수 없어요. (남은 기회 ${info.attemptsLeft}회)</li>
      <li>허위로 소유권을 주장하면 이용이 제한될 수 있습니다.</li></ul></div></div>
    ${info.highValue?`<div class="notice notice-warn">${icon('receipt')}<div><b>고가 물품입니다.</b> 승인 과정에서 영수증·구매 내역·시리얼 번호 등 추가 증빙을 요청받을 수 있어요.</div></div>`:''}
    <div class="notice notice-warn" style="font-size:13px">${icon('alert')}<div>시연 버전에서는 답변 비교가 브라우저 안에서 이루어집니다. 실제 서비스에서는 서버에서 비교하며 정답은 브라우저로 전송되지 않습니다.</div></div>
    <div class="modal-foot"><button class="btn btn-outline" data-close>취소</button><button class="btn btn-primary" id="c-next">다음 ${icon('right')}</button></div></div>`,
  m => m.querySelector('#c-next').addEventListener('click', step2));

  function step2(){
    openModal(head()+`<div class="modal-body">${ind(2)}
      ${info.question
        ? `<div class="question-box"><small>${icon('lock')}등록자의 비공개 확인 질문</small><p>${esc(info.question)}</p></div>`
        : `<div class="question-box"><small>${icon('lock')}확인 질문이 없는 게시글</small><p>공개 설명에 없는, 주인만 알 수 있는 특징을 자세히 적어 주세요.</p></div><p class="hint">등록자가 실제 물건과 비교해 직접 판단합니다.</p>`}
      <form id="claim-form" novalidate style="display:flex;flex-direction:column;gap:14px">
        <div class="field"><label for="c-ans">답변<span class="req">*</span></label><textarea class="textarea" id="c-ans" maxlength="300" placeholder="${info.question?'예: 안쪽에 고양이 모양 스티커가 붙어 있어요':'예: 왼쪽 주머니 안쪽에 이름 이니셜이 수놓아져 있어요'}" style="min-height:90px"></textarea><span class="err">답변을 2자 이상 입력해 주세요.</span></div>
        <div class="field"><label for="c-msg">등록자에게 남길 메시지 <span class="hint">(선택)</span></label><input class="input" id="c-msg" maxlength="300" placeholder="잃어버린 상황 등을 간단히 적어 주세요 (전화번호는 적지 마세요)"></div>
        <div class="modal-foot"><button type="button" class="btn btn-outline" data-close>취소</button><button class="btn btn-primary" type="submit">${icon('shield')}인증 요청 보내기</button></div>
      </form><p class="hint" style="text-align:center">남은 시도 기회: <b>${info.attemptsLeft}회</b></p></div>`,
    m => {
      m.querySelector('#c-ans').focus();
      m.querySelector('#claim-form').addEventListener('submit', e=>{
        e.preventDefault(); const ans = m.querySelector('#c-ans').value.trim(); const msg = m.querySelector('#c-msg').value.trim();
        const fld = m.querySelector('#c-ans').closest('.field');
        if(ans.length<2){ fld.classList.add('has-error'); return; }
        if(PHONE_RE.test(msg)){ toast('메시지에 전화번호를 적지 마세요. 승인되면 연락처가 공개됩니다.','err'); return; }
        try { const r = Api.submitClaim(it.id, {answer:ans, message:msg}); step3(r); } catch(err){ toast(err.message,'err'); }
      });
    });
  }
  function step3(r){
    if(r.result==='locked') return lockedView(r.lockedUntil);
    const map = {
      submitted:{ic:'check',cls:'ok',title:'인증 요청 완료!',text:'답변이 등록된 정보와 일치하여 등록자에게 요청이 전달되었어요.<br><b>아직 소유권이 확정된 것은 아닙니다.</b> 등록자가 최종 승인하면 연락처가 공개돼요.'},
      pending:{ic:'clock',cls:'wait',title:'인증 대기 중',text:'요청이 등록자에게 전달되었어요. 등록자가 설명을 실제 물건과 비교한 뒤 승인 여부를 결정합니다.'},
      failed:{ic:'x',cls:'fail',title:'인증 실패',text:`답변이 등록된 정보와 일치하지 않아요.<br>남은 시도 기회: <b>${r.attemptsLeft}회</b>`},
    }[r.result];
    openModal(head()+`<div class="modal-body">${ind(3)}<div class="result-ic ${map.cls}">${icon(map.ic)}</div><div class="result-title">${map.title}</div><p class="result-text">${map.text}</p>
      ${r.result!=='failed'?`<div class="notice notice-warn">${icon('alert')}<div>승인 후에도 물건은 <b>지구대·역 유실물센터·사람 많은 공공장소</b>에서 주고받으세요.</div></div>`:''}
      <div class="modal-foot">${r.result==='failed'?`<button class="btn btn-outline" data-close>닫기</button><button class="btn btn-primary" id="c-retry">다시 시도</button>`:`<a class="btn btn-outline" href="#/mypage/sent" data-close>내가 보낸 요청</a><button class="btn btn-primary" data-close>확인</button>`}</div></div>`,
    m => { const rb = m.querySelector('#c-retry'); if(rb) rb.addEventListener('click', ()=>{ info = Api.getClaimInfo(it.id); step2(); }); });
    if(r.result!=='failed'){ const bg = document.getElementById('modal'); bg && bg.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', ()=>setTimeout(render,0))); }
  }
  function lockedView(until){
    const mins = Math.max(1, Math.ceil((until-Date.now())/60000));
    openModal(head()+`<div class="modal-body"><div class="result-ic fail">${icon('lock')}</div><div class="result-title">잠시 후 다시 시도해 주세요</div>
      <p class="result-text">답변이 ${MAX_FAILS}번 연속 일치하지 않아 이 게시글에 대한 인증 요청이 <b>${mins}분 동안</b> 제한됩니다.<br>(${fmtDateTime(new Date(until).toISOString())}까지)</p>
      <div class="notice notice-info">${icon('info')}<div>정말 내 물건인데 기억이 나지 않는다면, 영수증이나 사진 등 증빙을 준비한 뒤 다시 시도하세요.</div></div>
      <div class="modal-foot"><button class="btn btn-primary" data-close>확인</button></div></div>`);
  }
}

/* ---------- 신고 모달 ---------- */
function reportModal(it){
  openModal(`<div class="modal-head"><h2>${icon('flag')}게시글 신고</h2><button class="modal-close" data-close aria-label="닫기">${icon('x')}</button></div>
  <form class="modal-body" id="rep-form" novalidate>
    <p class="hint">"${esc(it.title)}" 게시글을 신고하는 이유를 선택해 주세요. 신고 내용은 운영팀만 확인합니다.</p>
    <div class="radio-list">${REPORT_REASONS.map((r,i)=>`<label class="radio-item"><input type="radio" name="reason" value="${r.id}" ${i===0?'checked':''}><div><b>${r.name}</b><span>${r.desc}</span></div></label>`).join('')}</div>
    <div class="field"><label for="rep-detail">상세 내용 <span class="hint">(선택, 기타는 필수)</span></label><textarea class="textarea" id="rep-detail" maxlength="500" style="min-height:80px" placeholder="구체적인 상황을 적어 주시면 검토에 도움이 돼요."></textarea></div>
    <div class="modal-foot"><button type="button" class="btn btn-outline" data-close>취소</button><button class="btn btn-danger" type="submit">${icon('flag')}신고하기</button></div>
  </form>`, m => {
    m.querySelector('#rep-form').addEventListener('submit', e=>{ e.preventDefault(); const f=e.target;
      try { Api.report(it.id, f.reason.value, f.querySelector('#rep-detail').value); closeModal(); toast('신고가 접수되었습니다. 운영팀이 검토할게요.'); } catch(err){ toast(err.message,'err'); } });
  });
}

/* =========================================================================
   페이지: 마이페이지
   ========================================================================= */
function MyPage(tab){
  const u = Api.currentUser(); const items = Api.listItems().filter(i=>i.isMine);
  const sent = Api.myClaimsSent(); const received = Api.myClaimsReceived();
  const myLost = items.filter(i=>i.type==='lost').sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const myFound = items.filter(i=>i.type==='found').sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const returned = [...items.filter(i=>i.status==='returned').map(i=>({item:i, role: i.type==='lost'?'내 분실물을 돌려받음':'습득물을 주인에게 돌려줌'})),
    ...sent.filter(c=>c.status==='approved' && c.item && c.item.status==='returned').map(c=>({item:c.item, role: c.item.type==='lost'?'주운 물건을 돌려줌':'내 물건을 돌려받음'}))];
  const pendingN = received.filter(c=>['pending','submitted'].includes(c.status)).length;
  const tabs = [
    ['info','내 정보',null],['lost','내가 등록한 분실물',myLost.length],['found','내가 등록한 습득물',myFound.length],
    ['sent','내가 보낸 인증 요청',sent.length],['received','내가 받은 인증 요청',pendingN?`<span class="badge-dot">${pendingN}</span>`:received.length],
    ['returned','반환 완료 목록',returned.length],['withdraw','회원 탈퇴',null],
  ];
  if(!tabs.some(t=>t[0]===tab)) tab='info';
  const itemRow = it => `<div class="list-item"><a href="#/item/${esc(it.id)}"><img src="${esc(imgSrc(it))}" alt=""></a><div class="li-body">
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${statusBadge(it.status)}${it.verified?'<span class="cs cs-approved" style="font-size:11px">소유자 확인 완료</span>':''}${it.isSample?'<span class="cs cs-pending" style="font-size:11px">샘플</span>':''}</div>
      <h4><a href="#/item/${esc(it.id)}">${esc(it.title)}</a></h4><p class="meta">${icon('pin')}<span>${esc(it.place)} · ${fmtDate(it.date)}</span></p></div>
    <div class="li-actions"><select class="select" data-status="${esc(it.id)}" aria-label="상태 변경">${Object.entries(STATUS).filter(([k])=>it.type==='lost'?k!=='found':k!=='searching').map(([k,s])=>`<option value="${k}" ${it.status===k?'selected':''}>${s.label}</option>`).join('')}</select>
      <a class="btn btn-outline btn-sm" href="#/edit/${esc(it.id)}">${icon('edit')}수정</a><button class="btn btn-danger btn-sm" data-del="${esc(it.id)}">${icon('trash')}삭제</button></div></div>`;
  const emptyBox = (t, link, label) => `<div class="empty">${icon('package')}<h3>${t}</h3>${link?`<p></p><a class="btn btn-primary" href="${link}">${label}</a>`:''}</div>`;
  let content = '';
  if(tab==='info') content = `<div class="panel"><h2 style="font-size:20px;color:var(--navy);margin-bottom:18px">내 정보</h2>
      <dl class="kv"><dt>닉네임</dt><dd>${esc(u.name)}</dd><dt>이메일</dt><dd>${esc(u.email)}</dd><dt>가입일</dt><dd>${fmtDate(u.createdAt)}</dd>
      <dt>활동</dt><dd>분실물 ${myLost.length} · 습득물 ${myFound.length} · 반환 완료 ${returned.length}</dd></dl>
      <form id="prof-form" class="form-section" style="margin-top:24px;padding-top:24px;border-top:1px solid var(--line-2)"><div class="field" style="max-width:360px"><label for="p-name">닉네임 변경</label><div style="display:flex;gap:8px"><input class="input" id="p-name" maxlength="12" value="${esc(u.name)}"><button class="btn btn-primary">저장</button></div><span class="hint">게시글에는 닉네임 일부가 가려져 표시돼요 (예: ${esc(maskName(u.name))}).</span></div></form>
      <div class="notice notice-info" style="margin-top:20px">${icon('lock')}<div><b>개인정보 최소 수집</b> · FIND IT은 닉네임과 이메일만 수집합니다. 연락처는 게시글별로 입력하며, 승인된 상대에게만 공개돼요.</div></div></div>`;
  else if(tab==='lost') content = myLost.length ? `<div class="list">${myLost.map(itemRow).join('')}</div>` : emptyBox('등록한 분실물이 없어요','#/register/lost','분실물 등록하기');
  else if(tab==='found') content = myFound.length ? `<div class="list">${myFound.map(itemRow).join('')}</div>` : emptyBox('등록한 습득물이 없어요','#/register/found','습득물 등록하기');
  else if(tab==='sent') content = sent.length ? `<div class="claims-list">${sent.map(c=>`<div class="claim-item"><div class="claim-head"><span class="who">${c.item?`<a href="#/item/${esc(c.item.id)}">${esc(c.item.title)}</a> <span class="type-pill ${c.item.type}" style="font-size:11px;padding:2px 8px">${c.item.type==='lost'?'분실물':'습득물'}</span>`:'삭제된 게시글'}</span>${claimBadge(c.status)}</div>
      <div class="claim-body"><span>${CLAIM_STATUS[c.status].desc}</span>${c.status!=='failed'?`<div class="qa">내 답변: <b>${esc(c.answer)}</b></div>`:''}${c.note?`<span class="hint">${esc(c.note)}</span>`:''}<span class="hint">${fmtDateTime(c.createdAt)}</span>
      ${c.contact?`<div class="contact-box">${icon('check')} 등록자 연락처 (${esc(c.contact.label)})<b>${esc(c.contact.value)}</b></div>`:''}</div></div>`).join('')}</div>`
      : emptyBox('보낸 인증 요청이 없어요','#/search','물건 찾아보기');
  else if(tab==='received') content = received.length ? `<div class="claims-list">${received.map(claimReceivedHtml).join('')}</div>` : emptyBox('받은 인증 요청이 없어요');
  else if(tab==='returned') content = returned.length ? `<div class="list">${returned.map(r=>`<div class="list-item"><a href="#/item/${esc(r.item.id)}"><img src="${esc(imgSrc(r.item))}" alt=""></a><div class="li-body">${statusBadge('returned')}<h4><a href="#/item/${esc(r.item.id)}">${esc(r.item.title)}</a></h4><p class="meta">${icon('handshake')}<span>${r.role}${r.item.returnedAt?' · '+fmtDate(r.item.returnedAt):''}</span></p></div></div>`).join('')}</div>` : emptyBox('아직 반환 완료된 물건이 없어요');
  else if(tab==='withdraw') content = `<div class="panel"><h2 style="font-size:20px;color:var(--navy);margin-bottom:12px">회원 탈퇴</h2>
      <div class="notice notice-danger">${icon('alert')}<div>탈퇴하면 <b>내가 등록한 게시글 ${items.length}개, 비공개 인증 정보, 주고받은 인증 요청</b>이 모두 삭제되며 되돌릴 수 없어요.</div></div>
      <form id="wd-form" style="margin-top:18px;max-width:380px;display:flex;flex-direction:column;gap:14px"><div class="field"><label for="wd-pw">비밀번호 확인</label><input type="password" class="input" id="wd-pw" autocomplete="current-password"></div>
      <label class="check"><input type="checkbox" id="wd-ok">위 내용을 확인했으며 탈퇴에 동의합니다.</label><button class="btn btn-danger" style="align-self:flex-start">회원 탈퇴</button></form></div>`;
  return { html: `<div class="container page"><div class="page-head"><h1>마이페이지</h1></div>
    <div class="my-layout"><aside class="my-side"><div class="my-profile"><span class="avatar">${esc(u.name[0])}</span><div><b>${esc(u.name)}</b><span>${esc(u.email)}</span></div></div>
      <nav class="my-menu">${tabs.map(([k,l,c])=>`<a href="#/mypage/${k}" class="${tab===k?'on':''} ${k==='withdraw'?'danger':''}">${l}${c!==null&&c!==undefined?`<span class="cnt">${c}</span>`:''}</a>`).join('')}</nav></aside>
    <section class="fade-in">${content}</section></div></div>`,
  mount(){
    const main = document.getElementById('main');
    main.querySelectorAll('[data-status]').forEach(s=>s.addEventListener('change', ()=>{ try { Api.setStatus(s.dataset.status, s.value); toast('상태가 변경되었습니다.'); render(); } catch(e){ toast(e.message,'err'); } }));
    main.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>confirmModal({title:'게시글 삭제', text:'이 게시글과 관련된 인증 요청이 모두 삭제됩니다. 되돌릴 수 없어요.', okText:'삭제', danger:true, onOk:()=>{ Api.deleteItem(b.dataset.del); toast('삭제되었습니다.'); setTimeout(render,0); }})));
    if(tab==='received') bindClaimDecisions(main);
    document.getElementById('prof-form')?.addEventListener('submit', e=>{ e.preventDefault(); try { Api.updateProfile({name:document.getElementById('p-name').value}); toast('닉네임이 변경되었습니다.'); render(); } catch(err){ toast(err.message,'err'); } });
    document.getElementById('wd-form')?.addEventListener('submit', e=>{ e.preventDefault();
      if(!document.getElementById('wd-ok').checked){ toast('탈퇴 동의에 체크해 주세요.','err'); return; }
      try { Api.deleteAccount(document.getElementById('wd-pw').value); toast('탈퇴가 완료되었습니다. 그동안 감사했습니다.'); go('#/'); render(); } catch(err){ toast(err.message,'err'); } });
  }};
}

/* =========================================================================
   페이지: 이용 방법
   ========================================================================= */
function How(){
  const steps = [
    ['plus','linear-gradient(135deg,#1D7FE0,#4FA8F5)','물건 등록','잃어버린 물건이나 주운 물건을 사진·장소·날짜와 함께 등록해요. 주인만 아는 특징은 비공개로 숨겨 둡니다.'],
    ['search','linear-gradient(135deg,#16284A,#2F4C80)','원하는 물건 검색','이름·카테고리·장소·날짜로 여러 조건을 함께 걸어 찾아요. 비공개 정보는 검색에 노출되지 않아요.'],
    ['shield','linear-gradient(135deg,#0FA89A,#3CC8B4)','소유자 인증 진행','숨겨 둔 특징에 대한 질문에 답하고, 등록자가 최종 승인해야 연락처가 공개돼요.'],
    ['handshake','linear-gradient(135deg,#F08C3C,#F6B26B)','안전하게 반환','지구대·역 유실물센터처럼 안전한 공공장소에서 만나 물건을 돌려받고 반환 완료로 표시해요.'],
  ];
  return { html: `<div class="container page">
    <div class="page-head" style="text-align:center"><h1>FIND IT 이용 방법</h1><p>처음이어도 괜찮아요. 네 단계면 물건이 주인에게 돌아갑니다.</p></div>
    <div class="how-steps">${steps.map(([ic,bg,t,d],i)=>`<div class="how-step"><span class="step-no">STEP ${i+1}</span><div class="how-ic" style="background:${bg}">${icon(ic)}</div><h3>${t}</h3><p>${d}</p></div>`).join('')}</div>

    <section class="section"><div class="section-head"><div><h2>소유자 인증은 이렇게 진행돼요</h2><p>답이 맞아도 자동으로 확정되지 않는 두 단계 확인</p></div></div>
      <div class="panel"><div class="flow">
        ${['인증 요청','비공개 질문 답변','자동 1차 확인','등록자 최종 승인','연락처 공개 · 반환'].map((s,i,a)=>`<span class="chip on" style="cursor:default">${i+1}. ${s}</span>${i<a.length-1?`<span class="arrow">${icon('right')}</span>`:''}`).join('')}
      </div>
      <div class="two-col" style="margin-top:22px">
        <div><h3 style="font-size:16px;color:var(--navy);margin-bottom:10px">인증 상태 안내</h3><div class="list" style="gap:8px">${Object.entries(CLAIM_STATUS).map(([k,s])=>`<div style="display:flex;gap:10px;align-items:center">${claimBadge(k)}<span class="hint" style="color:var(--text-2)">${s.desc}</span></div>`).join('')}</div></div>
        <div><h3 style="font-size:16px;color:var(--navy);margin-bottom:10px">악용을 막는 장치</h3><ul class="tip-list">
          <li>${icon('check')}비공개 특징은 게시글·검색 결과에 절대 표시되지 않아요.</li>
          <li>${icon('check')}${MAX_FAILS}번 연속 틀리면 ${LOCK_MINUTES}분 동안 다시 시도할 수 없어요.</li>
          <li>${icon('check')}게시글 수정·삭제·승인은 작성자 본인만 할 수 있어요.</li>
          <li>${icon('check')}고가 물품은 영수증·구매내역 등 추가 증빙을 권장해요.</li>
          <li>${icon('check')}연락처는 최종 승인된 상대에게만 공개돼요.</li></ul></div>
      </div></div></section>

    <section class="section"><div class="section-head"><div><h2>안전 수칙</h2></div></div>
      <div class="two-col">
        <div class="panel"><h3 style="font-size:16px;color:var(--navy);margin-bottom:8px">${icon('lock')} 개인정보 지키기</h3><ul class="tip-list">
          <li>${icon('check')}공개 게시판에 전화번호·주소를 직접 적지 마세요. (전화번호는 자동으로 막혀요)</li>
          <li>${icon('check')}신분증·카드 사진은 이름·번호가 보이지 않게 가려 주세요.</li>
          <li>${icon('check')}습득물 게시글에는 모든 특징을 공개하지 말고, 일부는 확인 질문으로 남겨 두세요.</li></ul></div>
        <div class="panel"><h3 style="font-size:16px;color:var(--navy);margin-bottom:8px">${icon('handshake')} 안전하게 만나기</h3><ul class="tip-list">
          <li>${icon('check')}지구대·파출소, 역 유실물센터, 사람이 많은 카페에서 낮 시간에 만나세요.</li>
          <li>${icon('check')}선입금·보상금·택배비를 먼저 요구하면 사기를 의심하고 신고하세요.</li>
          <li>${icon('check')}고가 물품·신분증은 경찰청 유실물 통합포털(LOST112)에도 함께 신고하세요.</li></ul></div>
      </div></section>

    <section class="section faq"><div class="section-head"><div><h2>자주 묻는 질문</h2></div></div>
      <details><summary>분실물 게시글에서 '제가 습득했어요' 버튼은 무엇인가요?</summary><p>분실물을 주운 분이 등록자(주인)가 숨겨 둔 특징을 물건에서 직접 확인해 답하는 기능이에요. 실제로 물건을 가지고 있는 사람인지 확인해, 보상금을 노린 거짓 연락을 막아 줍니다.</p></details>
      <details><summary>습득물에 확인 질문이 없으면 어떻게 되나요?</summary><p>요청자가 공개되지 않은 특징을 직접 설명하고, 습득자가 실제 물건과 비교해 승인 여부를 결정합니다. 이 경우 상태는 '인증 대기 중'으로 표시돼요.</p></details>
      <details><summary>답변이 맞았는데 왜 바로 연락처가 안 보이나요?</summary><p>답변 일치는 1차 확인일 뿐이에요. 등록자가 요청 내용을 보고 최종 승인해야 서로의 연락처가 공개됩니다. 다른 사람이 우연히 맞히는 경우를 막기 위한 장치예요.</p></details>
      <details><summary>이 사이트의 데이터는 어디에 저장되나요?</summary><p>지금 보고 계신 버전은 <b>시연용</b>으로, 데이터가 이 브라우저의 localStorage에만 저장됩니다. 다른 사람과 공유되지 않고 실제 보안 인증도 아니에요. 실서비스는 Supabase 같은 서버에서 비공개 정보를 분리 저장하고, 서버 함수로 답변을 비교합니다.</p></details>
      <details><summary>체험해 보려면 어떻게 하나요?</summary><p>demo1@findit.kr / demo2@findit.kr (비밀번호 demo1234) 계정으로 로그인해 보세요. 예를 들어 demo1로 로그인해 '흰색 무선 이어폰' 게시글에서 소유자 확인을 요청하고, demo2로 다시 로그인해 '내가 받은 인증 요청'에서 승인할 수 있어요. 질문의 정답은 데모 안내 상자(로그인 화면)에 있습니다.</p></details>
    </section>
    <div style="text-align:center;margin-top:36px" class="hero-actions"><a class="btn btn-primary btn-lg" href="#/register/lost">${icon('plus')}분실물 등록하기</a><a class="btn btn-outline btn-lg" href="#/register/found">${icon('package')}습득물 등록하기</a></div>
  </div>` };
}

/* =========================================================================
   페이지: 로그인 / 회원가입
   ========================================================================= */
function Login(q){
  if(Api.currentUser()){ setTimeout(()=>go('#/mypage/info'),0); return {html:''}; }
  return { html: `<div class="container page"><div class="auth-wrap"><div class="panel">
    <h1>로그인</h1><p class="sub">FIND IT에 오신 것을 환영해요</p>
    <form id="login-form" novalidate style="display:flex;flex-direction:column;gap:14px">
      <div class="field"><label for="l-email">이메일</label><input class="input" id="l-email" type="email" autocomplete="email" placeholder="example@email.com"></div>
      <div class="field"><label for="l-pw">비밀번호</label><input class="input" id="l-pw" type="password" autocomplete="current-password"></div>
      <button class="btn btn-primary btn-lg btn-block">로그인</button>
    </form>
    <p class="auth-switch">아직 회원이 아니신가요? <a href="#/signup${q.next?'?next='+encodeURIComponent(q.next):''}">회원가입</a></p>
    <div class="demo-accounts"><b>${icon('sparkle')} 체험용 계정</b> <span class="hint">(시연 버전)</span>
      <div class="demo-acc"><div><b>김민준</b><br><code>demo1@findit.kr / demo1234</code></div><button class="btn btn-outline btn-sm" data-demo="demo1@findit.kr">이 계정으로</button></div>
      <div class="demo-acc"><div><b>이서연</b><br><code>demo2@findit.kr / demo1234</code></div><button class="btn btn-outline btn-sm" data-demo="demo2@findit.kr">이 계정으로</button></div>
      <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600;color:var(--accent)">인증 흐름 체험 가이드 (샘플 정답 포함)</summary>
        <ol style="margin:8px 0 0 18px;color:var(--text-2);line-height:1.8">
          <li><b>김민준</b>으로 로그인 → '흰색 무선 이어폰' 상세 → 내 물건 확인하기 → <code>JH 이니셜 각인</code> 입력</li>
          <li>로그아웃 후 <b>이서연</b>으로 로그인 → 마이페이지 › 내가 받은 인증 요청 → 승인</li>
          <li>다시 김민준으로 로그인하면 연락처가 공개된 것을 확인할 수 있어요.</li>
          <li>틀린 답을 3번 입력하면 10분 잠금이 걸리는 것도 확인해 보세요.</li>
          <li>'갈색 백팩'에는 이서연이 보낸 요청이 이미 와 있어요 (김민준이 승인/거절).</li>
        </ol><p class="hint" style="margin-top:6px">※ 실서비스에서는 정답이 이렇게 공개되지 않습니다. 시연을 위한 안내예요.</p></details>
    </div></div></div></div>`,
  mount(){
    const f = document.getElementById('login-form');
    const doLogin = (email, pw) => { try { const u = Api.login({email, password:pw}); toast(`${u.name}님, 환영합니다!`); go('#'+(q.next && q.next.startsWith('/') ? q.next : '/')); } catch(e){ toast(e.message,'err'); } };
    f.addEventListener('submit', e=>{ e.preventDefault(); doLogin(f.querySelector('#l-email').value, f.querySelector('#l-pw').value); });
    document.querySelectorAll('[data-demo]').forEach(b=>b.addEventListener('click', ()=>doLogin(b.dataset.demo,'demo1234')));
  }};
}
function Signup(q){
  if(Api.currentUser()){ setTimeout(()=>go('#/mypage/info'),0); return {html:''}; }
  return { html: `<div class="container page"><div class="auth-wrap"><div class="panel">
    <h1>회원가입</h1><p class="sub">닉네임과 이메일만으로 간단하게 가입해요</p>
    <form id="su-form" novalidate style="display:flex;flex-direction:column;gap:14px">
      <div class="field" data-field="name"><label for="s-name">닉네임<span class="req">*</span></label><input class="input" id="s-name" maxlength="12" placeholder="2~12자"><span class="err"></span></div>
      <div class="field" data-field="email"><label for="s-email">이메일<span class="req">*</span></label><input class="input" id="s-email" type="email" autocomplete="email" placeholder="example@email.com"><span class="err"></span></div>
      <div class="field" data-field="pw"><label for="s-pw">비밀번호<span class="req">*</span></label><input class="input" id="s-pw" type="password" autocomplete="new-password" placeholder="8자 이상"><span class="err"></span></div>
      <div class="field" data-field="pw2"><label for="s-pw2">비밀번호 확인<span class="req">*</span></label><input class="input" id="s-pw2" type="password" autocomplete="new-password"><span class="err"></span></div>
      <label class="check"><input type="checkbox" id="s-agree"><span>개인정보 수집·이용에 동의합니다. <span class="hint">(수집 항목: 닉네임, 이메일 · 목적: 회원 식별 및 인증 요청 연락 · 보관: 탈퇴 시 즉시 삭제)</span></span></label>
      <div class="notice notice-warn" style="font-size:13px">${icon('alert')}<div>시연 버전입니다. 실제로 쓰는 비밀번호는 입력하지 마세요.</div></div>
      <button class="btn btn-primary btn-lg btn-block">가입하기</button>
    </form>
    <p class="auth-switch">이미 계정이 있으신가요? <a href="#/login${q.next?'?next='+encodeURIComponent(q.next):''}">로그인</a></p>
  </div></div></div>`,
  mount(){
    const f = document.getElementById('su-form');
    f.addEventListener('input', e=>{ e.target.closest('[data-field]')?.classList.remove('has-error'); });
    f.addEventListener('submit', e=>{ e.preventDefault();
      const val = id => f.querySelector(id).value; const errs = {};
      if(val('#s-name').trim().length<2) errs.name='닉네임은 2~12자로 입력해 주세요.';
      if(!EMAIL_RE.test(val('#s-email').trim())) errs.email='올바른 이메일을 입력해 주세요.';
      if(val('#s-pw').length<8) errs.pw='비밀번호는 8자 이상이어야 합니다.';
      if(val('#s-pw')!==val('#s-pw2')) errs.pw2='비밀번호가 일치하지 않습니다.';
      Object.entries(errs).forEach(([k,m])=>{ const el=f.querySelector(`[data-field="${k}"]`); el.classList.add('has-error'); el.querySelector('.err').textContent=m; });
      if(Object.keys(errs).length) return;
      if(!f.querySelector('#s-agree').checked){ toast('개인정보 수집·이용에 동의해 주세요.','err'); return; }
      try { const u = Api.signup({name:val('#s-name'), email:val('#s-email'), password:val('#s-pw')}); toast(`가입을 환영해요, ${u.name}님!`); go('#'+(q.next && q.next.startsWith('/') ? q.next : '/')); } catch(err){ toast(err.message,'err'); }
    });
  }};
}
function NotFound(title='페이지를 찾을 수 없어요', text='주소가 바뀌었거나 삭제된 페이지입니다.'){
  return {html:`<div class="container page"><div class="empty">${icon('search')}<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="action-row" style="justify-content:center;max-width:320px;margin:0 auto"><a class="btn btn-outline" href="#/search">목록으로</a><a class="btn btn-primary" href="#/">홈으로</a></div></div></div>`};
}

/* ---------- 시작 ---------- */
Api.init();
if(!Api.storageOk) setTimeout(()=>toast('이 브라우저에서 저장소를 쓸 수 없어 새로고침하면 데이터가 사라져요.','err'), 500);
render();
</script>
</body>
</html>
